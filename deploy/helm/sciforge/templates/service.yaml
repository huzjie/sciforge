apiVersion: v1
kind: Service
metadata:
  name: {{ include "sciforge.fullname" . }}
  labels:
    {{- include "sciforge.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "sciforge.labels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8000
