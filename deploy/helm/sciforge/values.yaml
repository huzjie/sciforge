replicaCount: 2

image:
  repository: ghcr.io/huzjie/sciforge
  tag: latest
  pullPolicy: IfNotPresent

config:
  provider: mock
  maxIterations: 30

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  host: sciforge.example.com

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "1"
