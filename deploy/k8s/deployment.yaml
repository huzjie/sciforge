apiVersion: apps/v1
kind: Deployment
metadata:
  name: sciforge-api
  namespace: sciforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sciforge-api
  template:
    metadata:
      labels:
        app: sciforge-api
    spec:
      containers:
        - name: api
          image: ghcr.io/huzjie/sciforge:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: sciforge-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1"
